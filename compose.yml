version: "3.9"

services:
  devopsdb:
    image: vasanthche/webapp:database
    ports:
      - "3306:3306"
    deploy:  
      replicas: 1
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - mynetwork

  application:
    image: vasanthche/webapp:java
    ports:
      - "1112:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

volumes:
  dbdata:
  
networks:
  mynetwork:
    driver: overlay
